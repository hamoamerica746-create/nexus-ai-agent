services:
  - type: web
    name: nexus-ai-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: UPSTREAM_URL
        value: https://integrate.api.nvidia.com/v1/chat/completions
      - key: AGENT_WORKSPACE
        value: /app/workspace
